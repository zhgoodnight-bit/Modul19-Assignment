<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking System</title>
    <!-- Bootstrap CSS Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Bank Management System</h2>
    <hr>

    <!-- Navigation Bar -->
    <nav class="mb-3">
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="btn btn-outline-primary btn-sm">Dashboard</a>
            <a href="{% url 'deposit' %}" class="btn btn-outline-primary btn-sm">Deposit</a>
            <a href="{% url 'withdraw' %}" class="btn btn-outline-primary btn-sm">Withdraw</a>
            <a href="{% url 'transactions' %}" class="btn btn-outline-primary btn-sm">Transactions</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-success btn-sm">Login</a>
            <a href="{% url 'register' %}" class="btn btn-outline-primary btn-sm">Register</a>
        {% endif %}
    </nav>

    <hr>
    <!-- Flash Messages -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

</div>
<script src="https://jsdelivr.net"></script>
</body>
</html>
