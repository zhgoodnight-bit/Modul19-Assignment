{% extends 'base.html' %}

{% block content %}

<h3>Login</h3>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Login
    </button>
</form>

<div class="mt-3">
    <p>
        Don't have a bank account yet?
        <!-- FIXED: Added the opening <a> tag with href attribute -->
        <a href="{% url 'register' %}">
            Register here
        </a>
    </p>
</div>

{% endblock %}
